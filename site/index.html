<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Karte radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5F8; --ticket:#FFFFFF; --ink:#17243A; --muted:#5B6B80; --line:#D5DCE5;
  --stamp:#C2185B; --stamp-soft:#FBE4EE;
  --ok:#1E8E5A; --ok-soft:#E1F4EA; --warn:#A86A12; --warn-soft:#FBF0DB;
  --soon:#2F6FD6; --soon-soft:#E3EDFC; --off:#7D8796; --off-soft:#ECEFF3;
  --radius:14px; --stub:84px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1724; --ticket:#182235; --ink:#E6ECF4; --muted:#9AA8BA; --line:#2A3850;
    --stamp:#F0628E; --stamp-soft:#3A1F2E;
    --ok:#4CC38A; --ok-soft:#173527; --warn:#E2A944; --warn-soft:#3A2E17;
    --soon:#77A6F5; --soon-soft:#1C2C4A; --off:#8C97A8; --off-soft:#222D40;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}

/* zaglavlje */
header{padding:28px 0 12px}
h1{font:800 clamp(34px,7vw,56px)/1.05 "Bricolage Grotesque",sans-serif;letter-spacing:-0.03em;margin:0}
h1 .dot{color:var(--stamp)}
.sub{color:var(--muted);margin:10px 0 0;font-size:14px}
.sub strong{color:var(--ink);font-weight:600}

/* filteri */
.filters{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);
  padding:12px 0;border-bottom:1px solid var(--line)}
.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.frow + .frow{margin-top:8px}
.search{flex:1 1 260px;min-width:0;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--ticket);color:var(--ink);
  padding:0 12px;font:inherit}
select{flex:0 1 auto;min-width:0;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--ticket);color:var(--ink);padding:0 10px;font:inherit;max-width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--ticket);color:var(--ink);font:500 14px/1 inherit;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--stamp);width:16px;height:16px}
.count{margin-left:auto;font-size:13px;color:var(--muted)}
:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}

/* sekcije */
h2{font:700 22px/1.2 "Bricolage Grotesque",sans-serif;letter-spacing:-0.01em;margin:28px 0 10px;display:flex;align-items:baseline;gap:10px}
h2 small{font:400 13px "IBM Plex Sans",sans-serif;color:var(--muted)}

/* prodaja uskoro */
.soon-strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.soon-card{scroll-snap-align:start;background:var(--soon-soft);border-radius:var(--radius);padding:12px 14px;text-decoration:none;display:block}
.soon-card .when{font:700 20px/1.1 "Bricolage Grotesque",sans-serif;color:var(--soon)}
.soon-card .what{font-weight:600;margin-top:6px;line-height:1.3}
.soon-card .where{font-size:13px;color:var(--muted)}

/* ulaznica */
.list{display:flex;flex-direction:column;gap:10px}
.tix{position:relative;display:grid;grid-template-columns:var(--stub) 1fr;background:var(--ticket);border-radius:var(--radius);
  text-decoration:none;min-height:84px;border:1px solid var(--line)}
.tix:hover{border-color:var(--muted)}
.stub{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;
  border-right:2px dashed var(--line);position:relative}
/* zarezi na perforaciji */
.stub::before,.stub::after{content:"";position:absolute;right:-9px;width:16px;height:16px;border-radius:50%;background:var(--paper);border:1px solid var(--line)}
.stub::before{top:-9px;clip-path:inset(50% 0 0 0)}
.stub::after{bottom:-9px;clip-path:inset(0 0 50% 0)}
.day{font:800 34px/1 "Bricolage Grotesque",sans-serif;letter-spacing:-0.03em}
.wd{font-size:12px;color:var(--muted);margin-top:4px;text-align:center;line-height:1.25}
.stub.nodate .day{font-size:20px;color:var(--muted)}
.body{padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:6px}
.title{font:700 17px/1.25 "Bricolage Grotesque",sans-serif;letter-spacing:-0.005em;overflow-wrap:anywhere}
.place{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.ccode{display:inline-block;font:600 11px/1 "IBM Plex Sans",sans-serif;padding:3px 5px;border-radius:5px;background:var(--off-soft);color:var(--muted);margin-right:6px;vertical-align:1px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-weight:600;font-size:12.5px;white-space:nowrap}
.s-ok{background:var(--ok-soft);color:var(--ok)} .s-warn{background:var(--warn-soft);color:var(--warn)}
.s-soon{background:var(--soon-soft);color:var(--soon)} .s-off{background:var(--off-soft);color:var(--off)}
.new{background:var(--stamp-soft);color:var(--stamp)}
.price{color:var(--ink);font-weight:500}
.score{margin-left:auto;color:var(--muted);font-size:12.5px;white-space:nowrap}
.score b{color:var(--ink);font-weight:600}
.tix.big .stub .day{color:var(--stamp)}

.empty,.err{background:var(--ticket);border:1px dashed var(--line);border-radius:var(--radius);padding:28px 18px;text-align:center;color:var(--muted)}
.empty button{margin-top:12px}
footer{color:var(--muted);font-size:13px;padding:36px 0 48px}
.btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font:500 14px inherit;cursor:pointer}

@media (max-width:560px){
  :root{--stub:68px}
  .day{font-size:28px}
  .title{font-size:16px}
  .count{width:100%;margin-left:0}
  .search{flex-basis:100%}
  select{flex:1 1 0}
}
@media (prefers-reduced-motion:no-preference){
  .tix{transition:border-color .15s}
}
</style>
</head>
<body>
<header class="wrap">
  <h1>Karte radar<span class="dot">.</span></h1>
  <p class="sub" id="sub">Učitavam evente…</p>
</header>

<div class="filters" role="search">
  <div class="wrap">
    <div class="frow">
      <input class="search" id="q" type="search" placeholder="Traži izvođača, dvoranu, grad…" aria-label="Pretraga">
      <select id="month" aria-label="Mjesec"><option value="">Svi mjeseci</option></select>
      <select id="status" aria-label="Status">
        <option value="">Svi statusi</option>
        <option value="InStock">U prodaji</option>
        <option value="LimitedAvailability">Malo karata</option>
        <option value="soon">Prodaja uskoro</option>
        <option value="none">Nema karata / rasprodano</option>
      </select>
    </div>
    <div class="frow">
      <div class="chips" id="cc" role="group" aria-label="Država"></div>
      <label class="toggle"><input type="checkbox" id="big" checked> Samo veliki</label>
      <label class="toggle"><input type="checkbox" id="onlynew"> Samo novo</label>
      <span class="count" id="count"></span>
    </div>
  </div>
</div>

<main class="wrap" id="main"></main>
<footer class="wrap" id="foot">Podaci se osvježavaju svakih 30 minuta. Klik na event otvara stranicu za kupnju.</footer>

<script>
(() => {
  const MONTHS = ["siječanj","veljača","ožujak","travanj","svibanj","lipanj","srpanj","kolovoz","rujan","listopad","studeni","prosinac"];
  const MON_SHORT = ["sij","velj","ožu","tra","svi","lip","srp","kol","ruj","lis","stu","pro"];
  const WD = ["ned","pon","uto","sri","čet","pet","sub"];
  const CC = [["","Sve"],["HR","Hrvatska"],["RS","Srbija"],["BA","BiH"],["SI","Slovenija"],["ME","Crna Gora"]];
  const CODE = {HR:"HR",RS:"RS",BA:"BiH",SI:"SLO",ME:"CG"};
  const STATUS = {InStock:["U prodaji","s-ok"],LimitedAvailability:["Malo karata","s-warn"],PreSale:["Pretprodaja","s-soon"],
    PreOrder:["Uskoro u prodaji","s-soon"],SoldOut:["Rasprodano","s-off"],OutOfStock:["Nema karata","s-off"],Discontinued:["Prodaja završena","s-off"]};
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  let DATA = null, BIG = 50;
  const KEY = "karte-radar-filters";
  const st = {q:"", month:"", status:"", cc:"", big:true, onlynew:false};
  try { Object.assign(st, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };

  const now = () => new Date();
  const saleDate = e => e.sale ? new Date(e.sale) : null;
  const isSoon = e => { const d = saleDate(e); return d && d > now(); };
  function fmtSale(d){ return `${d.getDate()}.${d.getMonth()+1}. u ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
  function untilText(d){
    const ms = d - now(); const h = Math.floor(ms/36e5), days = Math.floor(h/24);
    if (h < 1) return "za manje od sat";
    if (days < 1) return `za ${h} h`;
    return `za ${days} d ${h%24} h`;
  }
  function ago(iso){
    const m = Math.round((now() - new Date(iso))/6e4);
    if (m < 2) return "upravo";
    if (m < 60) return `prije ${m} min`;
    const h = Math.round(m/60); return h < 24 ? `prije ${h} h` : `prije ${Math.round(h/24)} d`;
  }

  function statusPill(e){
    if (isSoon(e)) return `<span class="pill s-soon">Prodaja od ${esc(fmtSale(saleDate(e)))}</span>`;
    const s = STATUS[e.st]; return s ? `<span class="pill ${s[1]}">${s[0]}</span>` : "";
  }

  function ticket(e){
    let stub;
    if (e.d){
      const d = new Date(e.d + "T12:00:00");
      stub = `<div class="stub"><div class="day">${d.getDate()}</div><div class="wd">${WD[d.getDay()]}<br>${MON_SHORT[d.getMonth()]} ${d.getFullYear() !== now().getFullYear() ? String(d.getFullYear()).slice(2) : ""}${e.tm ? "<br>"+esc(e.tm) : ""}</div></div>`;
    } else {
      stub = `<div class="stub nodate"><div class="day">?</div><div class="wd">${e.dt ? esc(e.dt).slice(0,18) : "bez datuma"}</div></div>`;
    }
    const place = [e.v, e.c].filter(Boolean).join(", ");
    return `<a class="tix${e.sc >= BIG ? " big" : ""}" href="${esc(e.u)}" target="_blank" rel="noopener">
      ${stub}
      <div class="body">
        <div class="title">${esc(e.t)}</div>
        <div class="place">${CODE[e.cc] ? `<span class="ccode">${CODE[e.cc]}</span>` : ""}${esc(place) || "&nbsp;"}</div>
        <div class="meta">
          ${e.new ? '<span class="pill new">Novo</span>' : ""}
          ${statusPill(e)}
          ${e.p ? `<span class="price">${esc(e.p)}</span>` : ""}
          <span class="score" title="Bodovi radara"><b>${e.sc}</b> bod.</span>
        </div>
      </div></a>`;
  }

  function matches(e){
    if (st.big && e.sc < BIG) return false;
    if (st.onlynew && !e.new) return false;
    if (st.cc && e.cc !== st.cc) return false;
    if (st.month && (!e.d || e.d.slice(0,7) !== st.month)) return false;
    if (st.status){
      if (st.status === "soon"){ if (!isSoon(e)) return false; }
      else if (st.status === "none"){ if (!["SoldOut","OutOfStock","Discontinued"].includes(e.st)) return false; }
      else if (e.st !== st.status || isSoon(e)) return false;
    }
    if (st.q){
      const hay = (e.t+" "+e.v+" "+e.c).toLocaleLowerCase("hr").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d");
      const q = st.q.toLocaleLowerCase("hr").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d");
      if (!q.split(/\s+/).every(w => hay.includes(w))) return false;
    }
    return true;
  }

  function render(){
    const evs = DATA.events.filter(matches);
    $("count").textContent = `${evs.length} od ${DATA.events.length}`;
    const main = $("main"); let html = "";

    const soon = evs.filter(isSoon).sort((a,b) => saleDate(a) - saleDate(b));
    if (soon.length && st.status !== "soon"){
      html += `<h2>Prodaja uskoro <small>${soon.length}</small></h2><div class="soon-strip">` +
        soon.slice(0,12).map(e => `<a class="soon-card" href="${esc(e.u)}" target="_blank" rel="noopener">
          <div class="when">${untilText(saleDate(e))}</div>
          <div class="what">${esc(e.t)}</div>
          <div class="where">${esc([e.v,e.c].filter(Boolean).join(", "))} · ${esc(fmtSale(saleDate(e)))}</div></a>`).join("") + `</div>`;
    }

    const dated = evs.filter(e => e.d).sort((a,b) => (a.d+a.tm).localeCompare(b.d+b.tm) || b.sc - a.sc);
    const undated = evs.filter(e => !e.d).sort((a,b) => b.sc - a.sc);
    let cur = "";
    for (const e of dated){
      const m = e.d.slice(0,7);
      if (m !== cur){
        if (cur) html += `</div>`;
        cur = m; const [y, mm] = m.split("-").map(Number);
        const n = dated.filter(x => x.d.startsWith(m)).length;
        html += `<h2>${MONTHS[mm-1][0].toUpperCase()+MONTHS[mm-1].slice(1)} ${y} <small>${n}</small></h2><div class="list">`;
      }
      html += ticket(e);
    }
    if (cur) html += `</div>`;
    if (undated.length){
      html += `<h2>Bez točnog datuma <small>${undated.length} · izvor ne daje datum, otvori za detalje</small></h2><div class="list">` +
        undated.map(ticket).join("") + `</div>`;
    }
    if (!evs.length){
      html = `<div class="empty" style="margin-top:24px">Nema evenata za ove filtere.<br><button class="btn" id="reset">Makni filtere</button></div>`;
    }
    main.innerHTML = html;
    const r = $("reset"); if (r) r.onclick = () => { Object.assign(st,{q:"",month:"",status:"",cc:"",big:true,onlynew:false}); syncInputs(); save(); render(); };
  }

  function syncInputs(){
    $("q").value = st.q; $("month").value = st.month; $("status").value = st.status;
    $("big").checked = st.big; $("onlynew").checked = st.onlynew;
    document.querySelectorAll("#cc .chip").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.cc === st.cc)));
  }

  function setup(){
    const months = [...new Set(DATA.events.filter(e => e.d).map(e => e.d.slice(0,7)))].sort();
    $("month").innerHTML = `<option value="">Svi mjeseci</option>` + months.map(m => {
      const [y, mm] = m.split("-").map(Number); return `<option value="${m}">${MONTHS[mm-1]} ${y}</option>`; }).join("");
    const present = new Set(DATA.events.map(e => e.cc));
    $("cc").innerHTML = CC.filter(([c]) => !c || present.has(c)).map(([c,l]) => `<button class="chip" type="button" data-cc="${c}" aria-pressed="false">${l}</button>`).join("");
    $("cc").onclick = ev => { const b = ev.target.closest(".chip"); if (!b) return; st.cc = b.dataset.cc; syncInputs(); save(); render(); };
    let t; $("q").oninput = ev => { clearTimeout(t); t = setTimeout(() => { st.q = ev.target.value.trim(); save(); render(); }, 120); };
    $("month").onchange = ev => { st.month = ev.target.value; save(); render(); };
    $("status").onchange = ev => { st.status = ev.target.value; save(); render(); };
    $("big").onchange = ev => { st.big = ev.target.checked; save(); render(); };
    $("onlynew").onchange = ev => { st.onlynew = ev.target.checked; save(); render(); };
    if (st.month && !months.includes(st.month)) st.month = "";
    syncInputs();
  }

  fetch("data.json?v=" + Date.now(), {cache:"no-store"})
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => {
      DATA = d; BIG = d.big || 50;
      const nBig = d.events.filter(e => e.sc >= BIG).length, nNew = d.events.filter(e => e.new).length;
      const upd = new Date(d.updated);
      $("sub").innerHTML = `<strong>${nBig}</strong> velikih evenata u HR, RS, BiH i SLO` +
        (nNew ? ` · <strong>${nNew}</strong> novih ovaj tjedan` : "") +
        ` · osvježeno ${ago(d.updated)} (${upd.getDate()}.${upd.getMonth()+1}. ${String(upd.getHours()).padStart(2,"0")}:${String(upd.getMinutes()).padStart(2,"0")})`;
      setup(); render();
    })
    .catch(() => {
      $("sub").textContent = "";
      $("main").innerHTML = `<div class="err" style="margin-top:24px">Podaci se nisu učitali. Osvježi stranicu za minutu; ako se ponavlja, radar je možda stao (pogledaj ntfy obavijesti).</div>`;
    });
})();
</script>
</body>
</html>

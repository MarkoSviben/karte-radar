name: radar

on:
  schedule:
    # vremena su UTC (zimi +1h, ljeti +2h po nasem). :13 i :43 jer je GitHub zagusen oko punih sati.
    - cron: "13,43 5-22 * * *"  # danju svakih 30 min
    - cron: "13 23,0-4 * * *"   # nocu svaki sat
  workflow_dispatch:
    inputs:
      digest_now:
        description: "Posalji jutarnji sazetak odmah"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instaliraj
        run: pip install -q -r requirements.txt

      - name: Ucitaj stanje (grana 'state')
        run: |
          mkdir -p state
          if git fetch -q --depth=1 origin state 2>/dev/null; then
            git show FETCH_HEAD:seen.json > state/seen.json
            echo "stanje ucitano ($(wc -c < state/seen.json) B)"
          else
            echo "nema stanja -> prvi run (baseline)"
          fi

      - name: Scan
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BANDSINTOWN_APP_ID: ${{ secrets.BANDSINTOWN_APP_ID }}
          RADAR_PAGE_URL: https://${{ github.repository_owner }}.github.io/karte-pregled/
        run: python -m radar scan ${{ inputs.digest_now && '--digest-now' || '' }}

      - name: Spremi stanje
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd state
          git init -q -b state
          git add seen.json PREGLED.md
          git -c user.name="radar-bot" -c user.email="radar-bot@users.noreply.github.com" commit -qm "state $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state

      - name: Objavi stranicu (karte-pregled)
        env:
          PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
          PAGES_REPO: ${{ github.repository_owner }}/karte-pregled
        run: |
          if [ -z "$PAGES_DEPLOY_KEY" ] || [ ! -f state/site/data.json ]; then echo "preskacem objavu stranice"; exit 0; fi
          mkdir -p ~/.ssh && echo "$PAGES_DEPLOY_KEY" > ~/.ssh/pages && chmod 600 ~/.ssh/pages
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          mkdir -p pub && cp state/site/index.html state/site/data.json pub/ && touch pub/.nojekyll
          cd pub
          git init -q -b main
          git add -A
          git -c user.name="radar-bot" -c user.email="radar-bot@users.noreply.github.com" commit -qm "pregled $(date -u +%FT%TZ)"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/pages -o IdentitiesOnly=yes" git push -qf "git@github.com:${PAGES_REPO}.git" main
          rm -f ~/.ssh/pages

      - name: Javi gresku
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="❌ Karte radar: run je pao. Log: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "$NTFY_TOPIC" ]; then
            curl -s -o /dev/null -H "Priority: high" -d "$MSG" "https://ntfy.sh/${NTFY_TOPIC}"
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            for chat in ${TELEGRAM_CHAT_ID//,/ }; do
              curl -s -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"                 --data-urlencode "chat_id=${chat}" --data-urlencode "text=${MSG}"
            done
          fi

    "dolazi|stize|stizu|prihaja|najavio|najavila|najavili|najava|najavljen|najavljena|odrzat ce|odrzace|odrzati|nastupit ce|nastupice|nastupa u|vraca se|vracaju se|povratak|nova turneja|regionalna turneja|svjetska turneja|svetska turneja|evropska turneja|europska turneja|world tour|tour 2027|prvi put u": 10
    "2027|2028": 5
    "zagreb|beograd|belgrade|sarajevo|ljubljana|split|novi sad|=nis|banja luka|mostar|tuzla|zenica|rijeka|osijek|zadar|pula|maribor|podgorica|budva|kragujevac|subotica": 5

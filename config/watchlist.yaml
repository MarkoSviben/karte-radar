# =====================================================================
#  WATCHLISTA: ovdje odlucujes sto je "veliko" i vrijedno obavijesti.
#  Uredjujes direktno na GitHubu (olovka), promjena vrijedi od iduceg runa.
#
#  Kako se boduje:
#   - svaki event dobije bodove: najjaci izvodjac + najjaci klub + najjaca
#     dvorana + SVE kljucne rijeci + bonus po vrsti (listing/najava...)
#   - score >= threshold_instant  -> odmah poruka na Telegram
#   - score >= threshold_digest   -> ide u jutarnji sazetak
#   - manje                        -> ignorira se
#
#  Format imena:
#   "Ceca|Svetlana Raznatovic"   alternativna imena odvojena s |
#   "=Tool"                      tocno podudaranje (bez padeza)
#   {"Coldplay": 90}             vlastita tezina za jednog izvodjaca
#  Dijakritici i cirilica nisu bitni (Đorđe = Djordje = Ђорђе),
#  padezi se hvataju automatski (Dino Merlin = Dina Merlina).
# =====================================================================

threshold_instant: 50
threshold_digest: 15

# drzave koje te zanimaju (event u drugoj drzavi se odbacuje)

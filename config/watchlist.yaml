    "turneja|turneju|world tour|=tour": 10
    "jedini koncert|ekskluzivno|prvi put u|prvi koncert|veliki koncert|spektakl": 10
    "stadion": 10
    "koncert|koncerta|concert": 5
    "festival": 5
    "stand up|standup|stendap|stand up show|komicar|komicarka|komicari|komedija": 10

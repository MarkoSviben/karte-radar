  sale: "ulaznice|ulaznica|karte|karata|kartama|vstopnice|vstopnic|prodaja|prodaje|presale|pretprodaja|predprodaja|rasprodan|rasprodano|razprodano|sold out|dodatni koncert|dodatni termin|novi termin|turneja|turneju|=tour|tickets|on sale"

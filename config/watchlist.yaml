# Vijest prolazi ako:
#  - spominje karte/prodaju (sale), ILI
#  - je NAJAVA dogadjaja (event + announce), za bilo kojeg izvodjaca/komicara, ILI
#  - spominje dogadjaj + nekoga s liste (tada samo u sazetak).
# Ostalo (tracevi, intervjui...) se ignorira.

    "za djecu|za decu|za otroke|djecja predstava|decja predstava|djeda mraz|deda mraz|bozicek": -30
    "radionica|radionice|delavnica|workshop": -40
    "poklon bon|poklon vaucer|vaucer|gift card|darilni bon": -60
    "paketi storitev|paket usluga": -40
    "muzej|zoo|zooloski|razstava|izlozba": -40
    "kino|projekcija": -20
    "parking": -50
    "clanstvo|clanarina|sezonska|sezonska ulaznica|paketna vstopnica|abonma|abonman": -40
    "preminuo|preminula|umro|umrla|sahrana": -60
    "tribute|tribjut|cover band|kaver bend|kao nekad": -60

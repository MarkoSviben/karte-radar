    "=bec|=becu|=beca|vienna|wien|sofija|sofiji|minhen|munchen|frankfurt|cirih|zurich|stutgart|stuttgart|cikago|chicago|toronto|melburn|sidnej|pariz|london|berlin|bazel|hamburg|dortmund|stokholm|malme|oslo|amsterdam|njujork|new york|skoplje|skopje|budimpesta|budapest|temisvar|grac|graz|klagenfurt|celovec|beljak|linz|salzburg": -40


# =====================================================================
#  IZVORI: svaki se moze ugasiti s enabled: false
#  type = koji parser se koristi (radar/sources/*.py)
#  every: N    -> izvor se pokrece samo svaki N-ti run (stedi minute)
#  allow_empty -> 0 rezultata nije greska (inace health check javlja kvar)
# =====================================================================

# Eventim: sitemap (novi eventi i izvodjaci) + javne stranice dvorana (datum, pocetak prodaje, status).
#  venue_scan_every: svaki koliki run se prolaze velike dvorane radi promjena (4 = svaka ~2h)
#  venue_min_weight: koje dvorane s watchliste se prate (40 = stadioni + arene)
#  venue_pages: koliko stranica po dvorani (10 evenata po stranici)
#  rotate_venues: svaki run jos toliko drugih dvorana sa zanimljivim eventima, redom ukrug
eventim_hr:
  type: eventim
  sitemap: https://www.eventim.hr/staticsite/sitemap/HRY/sitemapindex_hr.xml
  country: HR
  venue_scan_every: 4
  venue_min_weight: 40
  venue_pages: 3
  rotate_venues: 6

eventim_si:
  type: eventim
  sitemap: https://www.eventim.si/staticsite/sitemap/SIB/sitemapindex_sl.xml
  country: SI
  venue_scan_every: 4
  venue_min_weight: 40
  venue_pages: 3
  rotate_venues: 6

tickets_rs:
  type: tickets_rs
  urls: [https://tickets.rs/]
  country: RS

gigstix:
  type: gigstix
  sitemap_index: https://new.gigstix.com/sitemap_index.xml
  country: RS

ulaznice_hr:
  type: ulaznice_hr
  url: https://www.ulaznice.hr/web/events
  country: HR

kupikartu_ba:
  type: kupikartu_ba
  urls: [https://www.kupikartu.ba/]
  country: BA

mojekarte_si:
  type: mojekarte_si
  sitemap: https://www.mojekarte.si/sitemap-si-perf.xml
  country: SI

# Google News: najave + Entrio eventi (Entrio blokira botove, ali Google ih indeksira).
# Uz ove pretrage radar SAM doda po jednu pretragu o kartama za svako ime s liste "pratim"
# (config/watchlist.yaml); follow_queries: false to gasi.
# Upit moze biti string (sr/RS izdanje, pokriva cijelu regiju) ili {q, lang, country}.
google_news:
  type: google_news
  queries:
    - "site:entrio.hr when:2d"
    - "site:entrio.ba when:2d"
    - "site:entrio.rs when:2d"
    - "prodaja ulaznica koncert when:2d"
    - "počela prodaja karata when:2d"
    - "karte za koncert when:2d"
    - "ulaznice za koncert when:2d"
    - "dodatni koncert when:3d"
    - "rasprodan koncert when:2d"
    - "koncert \"Arena Zagreb\" when:3d"
    - "koncert \"Štark Arena\" OR \"Beogradska arena\" when:3d"
    - "koncert Zetra OR Koševo OR Sarajevo karte when:3d"
    - "stadion koncert karte when:3d"
    - "turneja Zagreb OR Beograd OR Ljubljana OR Sarajevo when:3d"
    - "ulaznice Dinamo OR Hajduk OR reprezentacija when:2d"
    - "karte Zvezda OR Partizan OR Orlovi when:2d"
    - "ulaznice \"Liga prvaka\" OR Euroliga when:3d"
    - {q: "koncert vstopnice when:2d", lang: sl, country: SI}
    - {q: "Stožice koncert when:3d", lang: sl, country: SI}
    - {q: "razprodano koncert when:3d", lang: sl, country: SI}
    # opce najave (bilo koji izvodjac / komicar), ne samo watchlista
    - "dolazi u Zagreb koncert when:3d"
    - "dolazi u Beograd koncert when:3d"
    - "dolazi u Sarajevo koncert when:3d"
    - "najavio koncert when:3d"
    - "najavila koncert when:3d"
    - "održat će koncert when:3d"
    - "održaće koncert when:3d"
    - "nova turneja when:3d"
    - "regionalna turneja when:3d"
    - "veliki koncert 2027 when:3d"
    - "koncert u Areni when:3d"
    - "stand up turneja when:3d"
    - "stand-up nastup Zagreb OR Beograd OR Sarajevo OR Novi Sad when:3d"
    - "komičar nastup when:3d"
    - "prvi put u Hrvatskoj OR Srbiji OR Sloveniji koncert when:3d"
    - {q: "prihaja v Ljubljano koncert when:3d", lang: sl, country: SI}
    - {q: "stand up Ljubljana when:3d", lang: sl, country: SI}
    - {q: "tour 2027 Zagreb OR Belgrade OR Ljubljana OR Sarajevo when:3d", lang: en, country: US}
    # izlazak karata: faze, dodatni termini, rasprodano (cesto Entrio eventi koji se inace ne vide)
    - "\"dodatni nastup\" OR \"novi termin\" OR \"dodan termin\" when:3d"
    - "\"nova faza\" OR \"early bird\" OR \"prva faza\" ulaznice when:3d"
    - "rasprodan nastup OR \"rasprodao nastup\" OR \"rasprodala\" when:3d"

